<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Flight Check" />
  <meta name="theme-color" content="#111210" />
  <title>Flight Check</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#111210; --bg2:#1a1c18; --bg3:#222420; --bg4:#2a2d28;
      --amber:#e8a020; --amber-dim:#7a5210; --amber-glow:#e8a02022;
      --green:#4caf7d; --green-dim:#1a3d2a;
      --red:#d9534f; --red-dim:#3d1a1a;
      --text:#e8e6df; --text-muted:#888880; --text-faint:#444440;
      --border:rgba(255,255,255,0.07); --border-amb:rgba(232,160,32,0.3);
      --mono:'Share Tech Mono',monospace; --sans:'Barlow',sans-serif;
      --r:6px;
    }
    html,body { height:100%; background:var(--bg); color:var(--text); font-family:var(--sans); -webkit-tap-highlight-color:transparent; overscroll-behavior:none; }
    .layout { display:flex; height:100vh; height:100dvh; overflow:hidden; }

    /* Sidebar */
    .sidebar { width:270px; min-width:270px; background:var(--bg2); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
    .sidebar-header { padding:20px 18px 16px; border-bottom:1px solid var(--border); }
    .app-title { font-family:var(--mono); font-size:17px; color:var(--amber); letter-spacing:2px; text-transform:uppercase; display:flex; align-items:center; gap:8px; }
    .app-title .ti { font-size:20px; }
    .app-sub { font-size:10px; color:var(--text-faint); letter-spacing:1px; text-transform:uppercase; margin-top:4px; font-family:var(--mono); }
    .sec-label { font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-faint); font-family:var(--mono); padding:14px 18px 6px; }
    .sb-scroll { flex:1; overflow-y:auto; padding-bottom:12px; }
    .sb-scroll::-webkit-scrollbar { width:3px; }
    .sb-scroll::-webkit-scrollbar-thumb { background:var(--bg4); border-radius:2px; }
    .plane-row { display:flex; align-items:center; padding:10px 18px; cursor:pointer; gap:10px; border-left:2px solid transparent; transition:all 0.15s; }
    .plane-row:hover { background:var(--bg3); }
    .plane-row.active { border-left-color:var(--amber); background:var(--amber-glow); }
    .plane-icon { width:30px; height:30px; border-radius:4px; background:var(--bg4); display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--text-muted); flex-shrink:0; }
    .plane-row.active .plane-icon { background:var(--amber-dim); color:var(--amber); }
    .plane-info { flex:1; min-width:0; }
    .plane-name { font-size:14px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .plane-row.active .plane-name { color:var(--amber); }
    .plane-meta { font-size:11px; color:var(--text-faint); font-family:var(--mono); margin-top:1px; }
    .plane-del { width:24px; height:24px; border:none; background:transparent; color:var(--text-faint); cursor:pointer; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:14px; opacity:0; transition:opacity 0.15s; flex-shrink:0; }
    .plane-row:hover .plane-del { opacity:1; }
    .plane-del:hover { color:var(--red); background:var(--red-dim); }
    .add-row { display:flex; align-items:center; gap:8px; padding:8px 18px; }
    .add-row input { flex:1; height:34px; background:var(--bg3); border:1px solid var(--border); border-radius:var(--r); color:var(--text); font-family:var(--sans); font-size:13px; padding:0 10px; outline:none; }
    .add-row input::placeholder { color:var(--text-faint); }
    .add-row input:focus { border-color:var(--amber-dim); }
    .icon-btn { width:34px; height:34px; border:1px solid var(--border); background:var(--bg3); border-radius:var(--r); color:var(--text-muted); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; transition:all 0.15s; }
    .icon-btn:hover { border-color:var(--amber-dim); color:var(--amber); background:var(--amber-glow); }
    .icon-btn:active { transform:scale(0.95); }
    .sidebar-footer { border-top:1px solid var(--border); padding:10px 18px; display:flex; gap:8px; }
    .footer-btn { flex:1; height:34px; border:1px solid var(--border); background:var(--bg3); border-radius:var(--r); color:var(--text-muted); font-family:var(--mono); font-size:11px; letter-spacing:0.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:5px; transition:all 0.15s; }
    .footer-btn:hover { border-color:var(--amber-dim); color:var(--amber); background:var(--amber-glow); }
    .footer-btn:active { transform:scale(0.97); }
    .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--bg3); border:1px solid var(--border-amb); color:var(--amber); font-family:var(--mono); font-size:12px; padding:10px 18px; border-radius:99px; z-index:200; opacity:0; transition:opacity 0.2s; pointer-events:none; }
    .toast.show { opacity:1; }

    /* Main */
    .main { flex:1; display:flex; flex-direction:column; overflow:hidden; background:var(--bg); }
    .top-bar { padding:16px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:16px; background:var(--bg2); flex-shrink:0; }
    .top-bar-left h2 { font-size:20px; font-weight:700; color:var(--text); letter-spacing:-0.3px; }
    .top-bar-left p { font-size:12px; color:var(--text-faint); font-family:var(--mono); margin-top:2px; letter-spacing:0.5px; }
    .top-actions { display:flex; gap:8px; align-items:center; flex-shrink:0; }
    .pill-btn { height:34px; padding:0 14px; border-radius:99px; border:1px solid var(--border); background:transparent; color:var(--text-muted); font-family:var(--sans); font-size:13px; cursor:pointer; display:flex; align-items:center; gap:6px; transition:all 0.15s; white-space:nowrap; }
    .pill-btn:hover { border-color:var(--amber-dim); color:var(--amber); }
    .pill-btn.danger:hover { border-color:var(--red); color:var(--red); background:var(--red-dim); }

    /* Tabs */
    .cl-tabs { display:flex; padding:0 24px; border-bottom:1px solid var(--border); background:var(--bg2); overflow-x:auto; flex-shrink:0; }
    .cl-tabs::-webkit-scrollbar { height:0; }
    .cl-tab { padding:11px 16px; font-size:13px; font-weight:500; color:var(--text-muted); cursor:pointer; border:none; background:transparent; border-bottom:2px solid transparent; white-space:nowrap; font-family:var(--sans); display:flex; align-items:center; gap:6px; transition:all 0.15s; margin-bottom:-1px; }
    .cl-tab:hover { color:var(--text); }
    .cl-tab.active { color:var(--amber); border-bottom-color:var(--amber); }
    .cl-tab .badge { font-size:10px; font-family:var(--mono); background:var(--bg4); padding:1px 6px; border-radius:99px; color:var(--text-faint); }
    .cl-tab.active .badge { background:var(--amber-dim); color:var(--amber); }
    .cl-tab-add { padding:11px 14px; color:var(--text-faint); cursor:pointer; font-size:18px; background:none; border:none; margin-bottom:-1px; }
    .cl-tab-add:hover { color:var(--amber); }

    /* Content */
    .content { flex:1; overflow-y:auto; padding:24px; }
    .content::-webkit-scrollbar { width:4px; }
    .content::-webkit-scrollbar-thumb { background:var(--bg4); border-radius:2px; }

    /* Progress */
    .prog-strip { display:flex; align-items:center; gap:14px; margin-bottom:20px; padding:14px 18px; background:var(--bg2); border:1px solid var(--border); border-radius:var(--r); }
    .prog-label { font-family:var(--mono); font-size:12px; color:var(--text-muted); white-space:nowrap; }
    .prog-bar { flex:1; height:4px; background:var(--bg4); border-radius:99px; overflow:hidden; }
    .prog-fill { height:100%; background:var(--amber); border-radius:99px; transition:width 0.4s cubic-bezier(0.4,0,0.2,1); }
    .prog-fill.complete { background:var(--green); }
    .prog-pct { font-family:var(--mono); font-size:13px; font-weight:700; color:var(--amber); min-width:36px; text-align:right; }
    .prog-pct.complete { color:var(--green); }

    /* Items */
    .cl-item { display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border:1px solid var(--border); border-radius:var(--r); margin-bottom:5px; background:var(--bg2); transition:all 0.15s; animation:fadeIn 0.2s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:translateY(0)} }
    .cl-item:hover { border-color:rgba(255,255,255,0.12); }
    .cl-item.checked { opacity:0.4; border-color:transparent; }
    .cl-item.important { border-color:var(--red) !important; border-left-width:3px; }
    .cl-item.important.checked { border-color:var(--red) !important; opacity:0.4; }
    .cl-checkbox { width:22px; height:22px; border-radius:4px; border:1.5px solid var(--text-faint); background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; transition:all 0.15s; }
    .cl-item.checked .cl-checkbox { background:var(--green); border-color:var(--green); }
    .cl-checkbox .ti { color:white; font-size:13px; display:none; }
    .cl-item.checked .cl-checkbox .ti { display:block; }
    .cl-item-body { flex:1; min-width:0; }
    .cl-item-text { font-family:var(--mono); font-size:13px; color:var(--text); line-height:1.5; }
    .cl-item.checked .cl-item-text { text-decoration:line-through; color:var(--text-faint); }
    .cl-item-value { font-size:11px; color:var(--amber); font-family:var(--mono); margin-top:2px; }
    .cl-item.checked .cl-item-value { color:var(--text-faint); }
    .cl-item-actions { display:flex; align-items:center; gap:2px; flex-shrink:0; opacity:0; transition:opacity 0.15s; }
    .cl-item:hover .cl-item-actions { opacity:1; }
    .ia-btn { width:26px; height:26px; border:none; background:transparent; color:var(--text-faint); cursor:pointer; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:14px; transition:all 0.15s; }
    .ia-btn:hover { background:var(--bg4); color:var(--text); }
    .ia-btn.important-btn.on { color:var(--red); }
    .ia-btn.del-btn:hover { color:var(--red); background:var(--red-dim); }
    .cl-item-edit { display:none; flex-direction:column; gap:6px; margin-top:6px; }
    .cl-item-edit.open { display:flex; }
    .cl-item-edit input { height:32px; background:var(--bg3); border:1px solid var(--amber-dim); border-radius:var(--r); color:var(--text); font-family:var(--mono); font-size:12px; padding:0 10px; outline:none; }
    .cl-item-edit-row { display:flex; gap:6px; }
    .cl-item-edit-row input { flex:1; }
    .edit-save { height:28px; padding:0 12px; background:var(--amber); border:none; border-radius:var(--r); color:#111; font-family:var(--sans); font-weight:700; font-size:12px; cursor:pointer; }
    .edit-cancel { height:28px; padding:0 10px; border:1px solid var(--border); background:transparent; color:var(--text-muted); border-radius:var(--r); font-family:var(--sans); font-size:12px; cursor:pointer; }

    /* Section header inside checklist */
    .cl-section { font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--amber-dim); font-family:var(--mono); padding:14px 0 6px; border-bottom:1px solid var(--border); margin-bottom:8px; margin-top:4px; }
    .cl-section:first-child { padding-top:0; }

    /* Add item */
    .add-item-row { display:flex; gap:8px; margin-top:14px; }
    .add-item-row input { flex:1; height:42px; background:var(--bg2); border:1px dashed var(--border); border-radius:var(--r); color:var(--text); font-family:var(--mono); font-size:13px; padding:0 14px; outline:none; transition:border-color 0.15s; }
    .add-item-row input:focus { border-color:var(--amber-dim); border-style:solid; }
    .add-item-row input::placeholder { color:var(--text-faint); }
    .add-item-row .val-in { width:130px; flex:none; }
    .add-item-btn { height:42px; padding:0 16px; background:var(--amber); border:none; border-radius:var(--r); color:#111; font-family:var(--sans); font-weight:700; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:5px; white-space:nowrap; }
    .add-item-btn:hover { opacity:0.88; }
    .add-item-btn:active { transform:scale(0.97); }

    /* Empty */
    .empty-state { text-align:center; padding:4rem 2rem; color:var(--text-faint); }
    .empty-state .ti { font-size:48px; display:block; margin-bottom:16px; color:var(--bg4); }
    .empty-state h3 { font-size:16px; font-weight:600; color:var(--text-muted); margin-bottom:8px; }
    .empty-state p { font-size:13px; line-height:1.6; max-width:280px; margin:0 auto; }

    /* Complete banner */
    .complete-banner { display:flex; align-items:center; gap:14px; padding:14px 18px; background:var(--green-dim); border:1px solid var(--green); border-radius:var(--r); margin-bottom:18px; }
    .complete-banner .ti { font-size:22px; color:var(--green); }
    .complete-banner h4 { font-size:13px; font-weight:700; color:var(--green); font-family:var(--mono); letter-spacing:1px; text-transform:uppercase; }
    .complete-banner p { font-size:12px; color:var(--text-muted); margin-top:2px; }

    /* Modal */
    .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; z-index:100; padding:24px; }
    .modal { background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:24px; width:100%; max-width:400px; }
    .modal h3 { font-size:16px; font-weight:700; margin-bottom:16px; color:var(--text); }
    .modal input { width:100%; height:42px; background:var(--bg3); border:1px solid var(--border); border-radius:var(--r); color:var(--text); font-family:var(--sans); font-size:14px; padding:0 14px; outline:none; margin-bottom:10px; }
    .modal input:focus { border-color:var(--amber-dim); }
    .modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
    .btn-cancel { height:38px; padding:0 16px; border:1px solid var(--border); background:transparent; color:var(--text-muted); border-radius:var(--r); font-family:var(--sans); font-size:14px; cursor:pointer; }
    .btn-confirm { height:38px; padding:0 18px; border:none; background:var(--amber); color:#111; border-radius:var(--r); font-family:var(--sans); font-size:14px; font-weight:700; cursor:pointer; }

    @media (max-width:700px) { .sidebar{width:220px;min-width:220px;} .content{padding:16px;} .top-bar{padding:12px 16px;} .cl-tabs{padding:0 16px;} }
    @media (max-width:520px) { .layout{flex-direction:column;} .sidebar{width:100%;min-width:0;height:auto;max-height:42vh;border-right:none;border-bottom:1px solid var(--border);} .main{flex:1;} }

    body.light {
      --bg:#f4f4f0; --bg2:#ffffff; --bg3:#eeeeea; --bg4:#e2e2dc;
      --amber:#b07400; --amber-dim:#fce5b0; --amber-glow:#b0740014;
      --green:#267a48; --green-dim:#cceedd;
      --red:#b83030; --red-dim:#fde0de;
      --text:#1c1c18; --text-muted:#66665e; --text-faint:#aaaaaa;
      --border:rgba(0,0,0,0.09); --border-amb:rgba(176,116,0,0.28);
    }
    #draw-canvas { background:#1a1c18; }
  </style>
</head>
<body>
<div class="layout">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="app-title"><i class="ti ti-plane"></i> Flight Check</div>
      <div class="app-sub">Pre-flight Checklists</div>
    </div>
    <div class="sec-label">Workspace</div>
    <div class="plane-row" id="notes-tab">
      <div class="plane-icon"><i class="ti ti-notes"></i></div>
      <div class="plane-info">
        <div class="plane-name">Notes</div>
        <div class="plane-meta">Scratch pad</div>
      </div>
    </div>
    <div class="sec-label">Aircraft</div>
    <div class="sb-scroll" id="plane-list"></div>
    <div class="add-row">
      <input type="text" id="new-plane-input" placeholder="New aircraftâ€¦" maxlength="30" />
      <button class="icon-btn" id="add-plane-btn" title="Add aircraft"><i class="ti ti-plus"></i></button>
    </div>
    <div class="sidebar-footer">
      <button class="footer-btn" id="export-btn"><i class="ti ti-download" style="font-size:13px"></i> Export</button>
      <button class="footer-btn" id="import-btn"><i class="ti ti-upload" style="font-size:13px"></i> Import</button>
      <button class="footer-btn" id="theme-btn" style="flex:none;width:38px;" title="Toggle light/dark mode"><i class="ti ti-sun" id="theme-icon" style="font-size:14px"></i></button>
    </div>
  </div>
  <input type="file" id="import-file" accept=".json" style="display:none" />
  <div class="toast" id="toast"></div>

  <div class="main">
    <div class="top-bar">
      <div class="top-bar-left">
        <h2 id="main-title">Select an aircraft</h2>
        <p id="main-sub">â† Choose an aircraft to get started</p>
      </div>
      <div class="top-actions" id="top-actions"></div>
    </div>
    <div class="cl-tabs" id="cl-tabs"></div>
    <div class="content" id="content">
      <div class="empty-state"><i class="ti ti-plane-tilt"></i><h3>No aircraft selected</h3><p>Select an aircraft from the sidebar.</p></div>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal" style="display:none">
  <div class="modal">
    <h3 id="modal-title">New checklist</h3>
    <input type="text" id="modal-input" maxlength="40" />
    <div class="modal-actions">
      <button class="btn-cancel" id="modal-cancel">Cancel</button>
      <button class="btn-confirm" id="modal-confirm">Create</button>
    </div>
  </div>
</div>

<script>
// â”€â”€ State â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
let db = null;
let activePlaneId = null;
let activeChecklistId = null;
let notesDB = JSON.parse(localStorage.getItem('flightcheck-notes-db') || 'null') || { nextId: 2, notes: [{ id: 1, name: 'Note 1' }], activeNoteId: 1 };

function save() { localStorage.setItem('flightcheck-db', JSON.stringify(db)); }
function uid() { return db.nextId++; }
function getPlane(id) { return db.planes.find(p => p.id === id); }
function getCL(plane, id) { return plane?.checklists.find(c => c.id === id); }
function saveNotesDB() { localStorage.setItem('flightcheck-notes-db', JSON.stringify(notesDB)); }
function saveNoteCanvas(id, url) { localStorage.setItem('flightcheck-note-' + id, url); }
function getNoteCanvas(id) { return localStorage.getItem('flightcheck-note-' + id); }
function notesUid() { return notesDB.nextId++; }

// â”€â”€ Render sidebar â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function renderSidebar() {
  const el = document.getElementById('plane-list');
  el.innerHTML = '';
  if (!db.planes.length) {
    el.innerHTML = '<div style="padding:12px 18px;font-size:12px;color:var(--text-faint);font-family:var(--mono);">No aircraft yet</div>';
    return;
  }
  db.planes.forEach(plane => {
    const done = plane.checklists.reduce((n,cl) => n + cl.items.filter(i=>i.done).length, 0);
    const total = plane.checklists.reduce((n,cl) => n + cl.items.length, 0);
    const div = document.createElement('div');
    div.innerHTML = `
      <div class="plane-row ${plane.id===activePlaneId?'active':''}" data-id="${plane.id}">
        <div class="plane-icon"><i class="ti ti-plane"></i></div>
        <div class="plane-info">
          <div class="plane-name">${plane.name}</div>
          <div class="plane-meta">${plane.checklists.length} lists Â· ${done}/${total}</div>
        </div>
        <button class="plane-del" data-del="${plane.id}"><i class="ti ti-trash"></i></button>
      </div>`;
    el.appendChild(div);
  });
}

// â”€â”€ Render main â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function renderMain() {
  const plane = getPlane(activePlaneId);
  const titleEl = document.getElementById('main-title');
  const subEl = document.getElementById('main-sub');
  const tabsEl = document.getElementById('cl-tabs');
  const contentEl = document.getElementById('content');
  const actionsEl = document.getElementById('top-actions');

  if (!plane) {
    titleEl.textContent = 'Select an aircraft';
    subEl.textContent = 'â† Choose or add an aircraft';
    tabsEl.innerHTML = ''; actionsEl.innerHTML = '';
    contentEl.innerHTML = '<div class="empty-state"><i class="ti ti-plane-tilt"></i><h3>No aircraft selected</h3><p>Select an aircraft from the sidebar.</p></div>';
    return;
  }

  titleEl.textContent = plane.name;
  subEl.textContent = `${plane.checklists.length} checklists Â· Always refer to POH`;

  actionsEl.innerHTML = `<button class="pill-btn danger" id="reset-btn"><i class="ti ti-refresh"></i> Reset all</button>`;
  document.getElementById('reset-btn').addEventListener('click', () => {
    if (confirm('Reset all checklists for this aircraft?')) {
      plane.checklists.forEach(cl => cl.items.forEach(i => i.done = false));
      save(); renderSidebar(); renderMain();
    }
  });

  // Tabs
  tabsEl.innerHTML = '';
  plane.checklists.forEach(cl => {
    const done = cl.items.filter(i=>i.done).length;
    const btn = document.createElement('button');
    btn.className = 'cl-tab' + (cl.id===activeChecklistId?' active':'');
    btn.dataset.id = cl.id;
    btn.innerHTML = `${cl.name} <span class="badge">${done}/${cl.items.length}</span>`;
    tabsEl.appendChild(btn);
  });
  const addTab = document.createElement('button');
  addTab.className = 'cl-tab-add'; addTab.title = 'New checklist';
  addTab.innerHTML = '<i class="ti ti-plus"></i>';
  addTab.addEventListener('click', openModal);
  tabsEl.appendChild(addTab);

  // Content
  if (!activeChecklistId && plane.checklists.length) activeChecklistId = plane.checklists[0].id;
  const cl = getCL(plane, activeChecklistId);

  if (!cl) {
    contentEl.innerHTML = '<div class="empty-state"><i class="ti ti-list-check"></i><h3>No checklists</h3><p>Tap + to add a checklist.</p></div>';
    return;
  }

  const done = cl.items.filter(i=>i.done).length;
  const total = cl.items.length;
  const pct = total ? Math.round((done/total)*100) : 0;
  const complete = done===total && total>0;

  let html = `<div class="prog-strip">
    <span class="prog-label">${cl.name.toUpperCase()}</span>
    <div class="prog-bar"><div class="prog-fill ${complete?'complete':''}" style="width:${pct}%"></div></div>
    <span class="prog-pct ${complete?'complete':''}">${pct}%</span>
  </div>`;

  if (complete) html += `<div class="complete-banner"><i class="ti ti-circle-check"></i><div><h4>Checklist complete</h4><p>All items verified. Safe flying!</p></div></div>`;

  if (!cl.items.length) {
    html += '<div class="empty-state" style="padding:2rem"><i class="ti ti-list-details"></i><h3>No items yet</h3><p>Add items below.</p></div>';
  } else {
    cl.items.forEach((item, idx) => {
      html += `<div class="cl-item ${item.done?'checked':''} ${item.important?'important':''}" data-item="${item.id}">
        <button class="cl-checkbox" data-check="${item.id}" aria-label="Toggle"><i class="ti ti-check"></i></button>
        <div class="cl-item-body">
          <div class="cl-item-text">${item.text}</div>
          ${item.value?`<div class="cl-item-value">→ ${item.value}</div>`:’’}
          <div class="cl-item-edit" id="edit-${item.id}">
            <input class="edit-text-input" type="text" value="${item.text}" placeholder="Step text" />
            <div class="cl-item-edit-row">
              <input class="edit-value-input" type="text" value="${item.value||''}" placeholder="Expected value" />
              <button class="edit-save" data-save="${item.id}">Save</button>
              <button class="edit-cancel" data-cancel="${item.id}">Cancel</button>
            </div>
          </div>
        </div>
        <div class="cl-item-actions">
          <button class="ia-btn" data-move-up="${item.id}" title="Move up" ${idx===0?'style="opacity:0.2;pointer-events:none"':''}><i class="ti ti-chevron-up"></i></button>
          <button class="ia-btn" data-move-down="${item.id}" title="Move down" ${idx===cl.items.length-1?'style="opacity:0.2;pointer-events:none"':''}><i class="ti ti-chevron-down"></i></button>
          <button class="ia-btn important-btn ${item.important?'on':''}" data-important="${item.id}" title="Mark important"><i class="ti ti-alert-triangle"></i></button>
          <button class="ia-btn" data-edit="${item.id}" title="Edit"><i class="ti ti-pencil"></i></button>
          <button class="ia-btn del-btn" data-del-item="${item.id}" title="Delete"><i class="ti ti-x"></i></button>
        </div>
      </div>`;
    });
  }

  html += `<div class="add-item-row">
    <input type="text" id="new-item-text" placeholder="New itemâ€¦" />
    <input type="text" id="new-item-value" class="val-in" placeholder="Expected value" />
    <button class="add-item-btn" id="add-item-btn"><i class="ti ti-plus"></i> Add</button>
  </div>`;

  contentEl.innerHTML = html;
  document.getElementById('add-item-btn').addEventListener('click', addItem);
  document.getElementById('new-item-text').addEventListener('keydown', e => { if(e.key==='Enter') addItem(); });
}

// â”€â”€ Actions â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function addPlane(name) {
  if (!name.trim()) return;
  const plane = { id: uid(), name: name.trim(), checklists: [] };
  db.planes.push(plane);
  activePlaneId = plane.id; activeChecklistId = null;
  save(); renderSidebar(); renderMain();
}

function deletePlane(id) {
  if (!confirm('Delete this aircraft and all its checklists?')) return;
  db.planes = db.planes.filter(p => p.id !== id);
  if (activePlaneId === id) { activePlaneId = db.planes[0]?.id || null; activeChecklistId = null; }
  save(); renderSidebar(); renderMain();
}

function addCL(name) {
  const plane = getPlane(activePlaneId);
  if (!plane || !name.trim()) return;
  const cl = { id: uid(), name: name.trim(), items: [] };
  plane.checklists.push(cl);
  activeChecklistId = cl.id;
  save(); renderSidebar(); renderMain();
}

function addItem() {
  const plane = getPlane(activePlaneId);
  const cl = getCL(plane, activeChecklistId);
  if (!cl) return;
  const text = document.getElementById('new-item-text')?.value.trim();
  if (!text) return;
  const value = document.getElementById('new-item-value')?.value.trim();
  cl.items.push({ id: uid(), text, value, done: false });
  save(); renderSidebar(); renderMain();
  setTimeout(() => document.getElementById('new-item-text')?.focus(), 50);
}

function toggleItem(itemId) {
  const plane = getPlane(activePlaneId);
  const cl = getCL(plane, activeChecklistId);
  const item = cl?.items.find(i => i.id === +itemId);
  if (item) { item.done = !item.done; save(); renderSidebar(); renderMain(); }
}

function deleteItem(itemId) {
  const plane = getPlane(activePlaneId);
  const cl = getCL(plane, activeChecklistId);
  if (!cl) return;
  cl.items = cl.items.filter(i => i.id !== +itemId);
  save(); renderSidebar(); renderMain();
}

// â”€â”€ Modal â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
let _modalCb = null;
function openModal(title, cb, defaultVal) {
  _modalCb = cb || null;
  document.getElementById('modal-title').textContent = title || 'New checklist';
  document.getElementById('modal-input').value = defaultVal || '';
  document.getElementById('modal').style.display = 'flex';
  setTimeout(() => document.getElementById('modal-input').focus(), 50);
}
function closeModal() { document.getElementById('modal').style.display = 'none'; _modalCb = null; }
document.getElementById('modal-confirm').addEventListener('click', () => {
  const val = document.getElementById('modal-input').value;
  const cb = _modalCb;
  closeModal();
  if (cb) cb(val); else addCL(val);
});
document.getElementById('modal-cancel').addEventListener('click', closeModal);
document.getElementById('modal').addEventListener('click', e => { if(e.target===document.getElementById('modal')) closeModal(); });
document.getElementById('modal-input').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('modal-confirm').click(); });

// â”€â”€ Event delegation â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
document.getElementById('plane-list').addEventListener('click', e => {
  const del = e.target.closest('[data-del]');
  if (del) { e.stopPropagation(); deletePlane(+del.dataset.del); return; }
  const row = e.target.closest('.plane-row[data-id]');
  if (row) {
    activePlaneId = +row.dataset.id;
    activeChecklistId = getPlane(activePlaneId)?.checklists[0]?.id || null;
    renderSidebar(); renderMain();
  }
});
document.getElementById('cl-tabs').addEventListener('click', e => {
  const tab = e.target.closest('.cl-tab[data-id]');
  if (tab) { activeChecklistId = +tab.dataset.id; renderMain(); }
});
document.getElementById('content').addEventListener('click', e => {
  const cb = e.target.closest('[data-check]');
  if (cb) { toggleItem(cb.dataset.check); return; }
  const del = e.target.closest('[data-del-item]');
  if (del) { deleteItem(del.dataset.delItem); return; }

  const imp = e.target.closest('[data-important]');
  if (imp) {
    const plane = getPlane(activePlaneId);
    const cl = getCL(plane, activeChecklistId);
    const item = cl?.items.find(i => i.id === +imp.dataset.important);
    if (item) { item.important = !item.important; save(); renderMain(); }
    return;
  }

  const editBtn = e.target.closest('[data-edit]');
  if (editBtn) {
    const id = editBtn.dataset.edit;
    const editEl = document.getElementById('edit-' + id);
    if (editEl) { editEl.classList.toggle('open'); editEl.querySelector('.edit-text-input')?.focus(); }
    return;
  }

  const saveBtn = e.target.closest('[data-save]');
  if (saveBtn) {
    const id = +saveBtn.dataset.save;
    const plane = getPlane(activePlaneId);
    const cl = getCL(plane, activeChecklistId);
    const item = cl?.items.find(i => i.id === id);
    if (item) {
      const editEl = document.getElementById('edit-' + id);
      const newText = editEl.querySelector('.edit-text-input').value.trim();
      const newVal = editEl.querySelector('.edit-value-input').value.trim();
      if (newText) { item.text = newText; item.value = newVal; save(); renderMain(); }
    }
    return;
  }

  const cancelBtn = e.target.closest('[data-cancel]');
  if (cancelBtn) {
    const editEl = document.getElementById('edit-' + cancelBtn.dataset.cancel);
    if (editEl) editEl.classList.remove('open');
    return;
  }

  const up = e.target.closest('[data-move-up]');
  if (up) {
    const plane = getPlane(activePlaneId);
    const cl = getCL(plane, activeChecklistId);
    const idx = cl.items.findIndex(i => i.id === +up.dataset.moveUp);
    if (idx > 0) { [cl.items[idx-1], cl.items[idx]] = [cl.items[idx], cl.items[idx-1]]; save(); renderMain(); }
    return;
  }

  const down = e.target.closest('[data-move-down]');
  if (down) {
    const plane = getPlane(activePlaneId);
    const cl = getCL(plane, activeChecklistId);
    const idx = cl.items.findIndex(i => i.id === +down.dataset.moveDown);
    if (idx < cl.items.length - 1) { [cl.items[idx], cl.items[idx+1]] = [cl.items[idx+1], cl.items[idx]]; save(); renderMain(); }
    return;
  }

  const item = e.target.closest('.cl-item');
  if (item && !e.target.closest('.cl-item-actions') && !e.target.closest('.cl-item-edit')) {
    toggleItem(item.dataset.item);
  }
});
document.getElementById('add-plane-btn').addEventListener('click', () => {
  const inp = document.getElementById('new-plane-input');
  addPlane(inp.value); inp.value = '';
});
document.getElementById('new-plane-input').addEventListener('keydown', e => {
  if (e.key==='Enter') document.getElementById('add-plane-btn').click();
});

// â”€â”€ Toast â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// â”€â”€ Export â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
document.getElementById('export-btn').addEventListener('click', () => {
  const json = JSON.stringify(db, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'flightcheck-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('Backup exported âœ“');
});

// â”€â”€ Import â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
document.getElementById('import-btn').addEventListener('click', () => {
  document.getElementById('import-file').click();
});
document.getElementById('import-file').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const imported = JSON.parse(ev.target.result);
      if (!imported.planes || !Array.isArray(imported.planes)) throw new Error('Invalid file');
      if (!confirm('This will replace all current aircraft and checklists. Continue?')) return;
      db = imported;
      activePlaneId = db.planes[0]?.id || null;
      activeChecklistId = db.planes[0]?.checklists[0]?.id || null;
      save(); renderSidebar(); renderMain();
      showToast('Backup imported âœ“');
    } catch {
      showToast('Invalid backup file âœ—');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// â”€â”€ Notes â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
let drawColor = '#e8e6df', drawSize = 4, drawTool = 'pen';

function renderNotes() {
  document.getElementById('main-title').textContent = 'Notes';
  document.getElementById('main-sub').textContent = 'Scratch pad';
  document.getElementById('top-actions').innerHTML = `
    <button class="pill-btn" id="undo-btn"><i class="ti ti-arrow-back-up"></i> Undo</button>
    <button class="pill-btn danger" id="clear-canvas-btn"><i class="ti ti-trash"></i> Clear</button>`;

  // Note tabs
  const tabsEl = document.getElementById('cl-tabs');
  tabsEl.innerHTML = '';
  notesDB.notes.forEach(note => {
    const btn = document.createElement('button');
    btn.className = 'cl-tab' + (note.id === notesDB.activeNoteId ? ' active' : '');
    btn.dataset.noteId = note.id;
    btn.innerHTML = `${note.name}${notesDB.notes.length > 1
      ? ` <span data-note-del="${note.id}" style="margin-left:5px;font-size:13px;line-height:1;opacity:0.45;vertical-align:middle;">&times;</span>`
      : ''}`;
    tabsEl.appendChild(btn);
  });
  const addNoteBtn = document.createElement('button');
  addNoteBtn.className = 'cl-tab-add';
  addNoteBtn.title = 'New note';
  addNoteBtn.innerHTML = '<i class="ti ti-plus"></i>';
  addNoteBtn.addEventListener('click', () => openModal('New note', name => {
    const note = { id: notesUid(), name: name.trim() || ('Note ' + (notesDB.notes.length + 1)) };
    notesDB.notes.push(note);
    notesDB.activeNoteId = note.id;
    saveNotesDB();
    renderNotes();
  }));
  tabsEl.appendChild(addNoteBtn);

  tabsEl.onclick = e => {
    const del = e.target.closest('[data-note-del]');
    if (del) {
      e.stopPropagation();
      const id = +del.dataset.noteDel;
      if (notesDB.notes.length === 1) return;
      if (!confirm('Delete this note?')) return;
      notesDB.notes = notesDB.notes.filter(n => n.id !== id);
      localStorage.removeItem('flightcheck-note-' + id);
      if (notesDB.activeNoteId === id) notesDB.activeNoteId = notesDB.notes[0].id;
      saveNotesDB();
      renderNotes();
      return;
    }
    const tab = e.target.closest('[data-note-id]');
    if (tab && +tab.dataset.noteId !== notesDB.activeNoteId) {
      notesDB.activeNoteId = +tab.dataset.noteId;
      saveNotesDB();
      renderNotes();
    }
  };

  tabsEl.ondblclick = e => {
    const tab = e.target.closest('[data-note-id]');
    if (!tab) return;
    const note = notesDB.notes.find(n => n.id === +tab.dataset.noteId);
    if (!note) return;
    openModal('Rename note', name => {
      if (name.trim()) { note.name = name.trim(); saveNotesDB(); renderNotes(); }
    }, note.name);
  };

  // Canvas + toolbar
  const contentEl = document.getElementById('content');
  contentEl.innerHTML = `
    <div id="draw-toolbar" style="display:flex;align-items:center;gap:6px;padding:0 0 12px;flex-wrap:wrap;">
      <span style="font-size:11px;color:var(--text-faint);font-family:var(--mono);margin-right:2px;">COLOR</span>
      ${['#e8e6df','#e8a020','#4caf7d','#d9534f','#5b9bd5'].map(c => `<button class="color-btn" data-color="${c}" style="width:22px;height:22px;border-radius:50%;background:${c};border:2px solid ${c === '#e8e6df' ? '#e8a020' : 'transparent'};cursor:pointer;flex-shrink:0;"></button>`).join('')}
      <span style="font-size:11px;color:var(--text-faint);font-family:var(--mono);margin-left:8px;margin-right:2px;">SIZE</span>
      ${[2,4,8,14].map((s,i) => `<button class="size-btn" data-size="${s}" style="width:${s+14}px;height:${s+14}px;border-radius:50%;background:var(--text-muted);border:2px solid ${i === 1 ? '#e8a020' : 'transparent'};cursor:pointer;flex-shrink:0;"></button>`).join('')}
      <span style="font-size:11px;color:var(--text-faint);font-family:var(--mono);margin-left:8px;margin-right:2px;">TOOL</span>
      <button class="tool-btn" data-tool="pen" style="height:28px;padding:0 10px;border-radius:4px;border:1px solid var(--amber);background:var(--amber-glow);color:var(--amber);font-family:var(--mono);font-size:11px;cursor:pointer;">PEN</button>
      <button class="tool-btn" data-tool="eraser" style="height:28px;padding:0 10px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text-muted);font-family:var(--mono);font-size:11px;cursor:pointer;">ERASER</button>
    </div>
    <canvas id="draw-canvas" style="display:block;width:100%;touch-action:none;cursor:crosshair;border-radius:var(--r);"></canvas>`;

  const canvas = document.getElementById('draw-canvas');
  canvas.width = contentEl.clientWidth;
  canvas.height = Math.max(contentEl.clientHeight - 52, 500);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#1a1c18';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const saved = getNoteCanvas(notesDB.activeNoteId);
  if (saved) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0); img.src = saved; }

  let drawing = false;
  let history = [];

  // Reflect persisted tool state on the freshly built toolbar
  document.querySelectorAll('.color-btn').forEach(b => b.style.borderColor = b.dataset.color === drawColor ? '#e8a020' : 'transparent');
  updateToolBtns();

  function persistCanvas() { saveNoteCanvas(notesDB.activeNoteId, canvas.toDataURL()); }

  function saveState() {
    history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    if (history.length > 40) history.shift();
  }

  function getPos(e) {
    const r = canvas.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return { x: (src.clientX - r.left) * (canvas.width / r.width), y: (src.clientY - r.top) * (canvas.height / r.height) };
  }

  function startDraw(e) { e.preventDefault(); saveState(); drawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
  function draw(e) {
    e.preventDefault();
    if (!drawing) return;
    const p = getPos(e);
    ctx.lineTo(p.x, p.y);
    ctx.strokeStyle = drawTool === 'eraser' ? '#1a1c18' : drawColor;
    ctx.lineWidth = drawTool === 'eraser' ? drawSize * 5 : drawSize;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.stroke();
  }
  function endDraw(e) { e.preventDefault(); drawing = false; ctx.beginPath(); persistCanvas(); }

  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', endDraw);
  canvas.addEventListener('touchstart', startDraw, { passive: false });
  canvas.addEventListener('touchmove', draw, { passive: false });
  canvas.addEventListener('touchend', endDraw, { passive: false });

  document.getElementById('clear-canvas-btn').addEventListener('click', () => {
    saveState();
    ctx.fillStyle = '#1a1c18';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    persistCanvas();
  });

  document.getElementById('undo-btn').addEventListener('click', () => {
    if (history.length) { ctx.putImageData(history.pop(), 0, 0); persistCanvas(); }
  });

  document.querySelectorAll('.color-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      drawColor = btn.dataset.color;
      drawTool = 'pen';
      document.querySelectorAll('.color-btn').forEach(b => b.style.borderColor = 'transparent');
      btn.style.borderColor = '#e8a020';
      updateToolBtns();
    });
  });

  document.querySelectorAll('.size-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      drawSize = +btn.dataset.size;
      document.querySelectorAll('.size-btn').forEach(b => b.style.borderColor = 'transparent');
      btn.style.borderColor = '#e8a020';
    });
  });

  document.querySelectorAll('.tool-btn').forEach(btn => {
    btn.addEventListener('click', () => { drawTool = btn.dataset.tool; updateToolBtns(); });
  });

  function updateToolBtns() {
    document.querySelectorAll('.tool-btn').forEach(b => {
      const on = b.dataset.tool === drawTool;
      b.style.borderColor = on ? 'var(--amber)' : 'var(--border)';
      b.style.background  = on ? 'var(--amber-glow)' : 'transparent';
      b.style.color       = on ? 'var(--amber)' : 'var(--text-muted)';
    });
  }
}

document.getElementById('notes-tab').addEventListener('click', () => {
  document.querySelectorAll('.plane-row').forEach(r => r.classList.remove('active'));
  document.getElementById('notes-tab').classList.add('active');
  activePlaneId = null;
  renderNotes();
});

// â”€â”€ Theme â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function applyTheme(light) {
  document.body.classList.toggle('light', light);
  document.getElementById('theme-icon').className = light ? 'ti ti-moon' : 'ti ti-sun';
}
if (localStorage.getItem('flightcheck-theme') === 'light') applyTheme(true);
document.getElementById('theme-btn').addEventListener('click', () => {
  const isLight = !document.body.classList.contains('light');
  localStorage.setItem('flightcheck-theme', isLight ? 'light' : 'dark');
  applyTheme(isLight);
});

// â”€â”€ Init â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
(async () => {
  const seed = await fetch('seed.json').then(r => r.json());
  db = JSON.parse(localStorage.getItem('flightcheck-db') || 'null');
  if (!db) {
    db = JSON.parse(JSON.stringify(seed));
  } else {
    let changed = false;
    const knownPlaneIds = new Set(db.planes.map(p => p.id));
    for (const seedPlane of seed.planes) {
      if (!knownPlaneIds.has(seedPlane.id)) {
        db.planes.push(JSON.parse(JSON.stringify(seedPlane)));
        changed = true;
      } else {
        const userPlane = db.planes.find(p => p.id === seedPlane.id);
        const knownClIds = new Set(userPlane.checklists.map(cl => cl.id));
        const newCls = seedPlane.checklists.filter(cl => !knownClIds.has(cl.id));
        if (newCls.length) {
          userPlane.checklists.push(...JSON.parse(JSON.stringify(newCls)));
          changed = true;
        }
      }
    }
    if (changed) save();
  }
  activePlaneId = db.planes[0]?.id || null;
  activeChecklistId = db.planes[0]?.checklists[0]?.id || null;
  renderSidebar();
  renderMain();
})();
</script>
